name: Run SPO Scraper Auto

on:
  # ตั้งเวลาให้รันอัตโนมัติ (เช่น รันทุกวันตอนเที่ยงคืน UTC)
  schedule:
    - cron: '0 0 * * *' 
  
  # อนุญาตให้กดรันเองได้จากหน้าเว็บ GitHub (แท็บ Actions)
  workflow_dispatch: 

jobs:
  scrape-data:
    runs-on: ubuntu-latest
    # เพิ่มการอนุญาตสิทธิ์ให้ GitHub Actions สามารถ Push ไฟล์กลับไปยัง Repository ได้
    permissions:
      contents: write 

    steps:
    # 1. ดึงโค้ดล่าสุดจาก Repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. ติดตั้ง Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # ระบุเวอร์ชัน Python ที่คุณต้องการ

    # 3. ติดตั้งไลบรารีต่างๆ จาก requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. รันสคริปต์ Python ของคุณ
    - name: Run Scraper Script
      run: python spo.py

    # 5. ตรวจสอบว่ามีการเปลี่ยนแปลงในไฟล์ output หรือไม่ แล้วทำการ Commit & Push กลับ
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add output/spo-b.txt
        # ตรวจสอบว่ามีไฟล์ใหม่หรือถูกแก้ไขหรือไม่ ถ้ามีให้ commit
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update scraped data" && git push)
